global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "datagouv-mcp-tn"
    static_configs:
      - targets: ["datagouv-mcp-tn:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
    metrics_path: "/metrics"
    scrape_interval: 30s
