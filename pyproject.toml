[project]
name = "datagouv-mcp-tn"
version = "0.1.0"
description = "MCP server for the Tunisian open data portal (data.gouv.tn)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagouv_mcp_tn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # bugbear
]
