services:
  # --- Application -----------------------------------------------------------
  datagouv-mcp-tn:
    build:
      context: .
      dockerfile: Dockerfile
    image: datagouv-mcp-tn:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - portal_api_keys
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    depends_on:
      nginx:
        condition: service_healthy

  # --- Reverse proxy + SSL ---------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # --- Optional: log aggregator ----------------------------------------------
  loki:
    image: grafana/loki:3.4
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # --- Optional: metrics exporter --------------------------------------------
  prometheus:
    image: prom/prometheus:v3.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  internal:
    driver: bridge
    internal: true

volumes:
  app-logs:
    driver: local
  nginx-cache:
    driver: local
  nginx-logs:
    driver: local
  loki-data:
    driver: local
  prometheus-data:
    driver: local

secrets:
  portal_api_keys:
    file: ./secrets/portal_api_keys.env
